<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10個ずつページングする仕様のサンプル</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  
  /* リストのスタイル */
  #item-list {
    margin-bottom: 20px;
    border-top: 1px solid #ccc;
  }
  .item {
    padding: 12px;
    border-bottom: 1px solid #ccc;
    background-color: #f9f9f9;
  }
  .item:nth-child(even) {
    background-color: #fff;
  }

  /* ページネーションのスタイル */
  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pagination button {
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid #ccc;
    background-color: #fff;
    border-radius: 4px;
    font-size: 14px;
  }
  .pagination button:hover:not(:disabled) {
    background-color: #e9ecef;
  }
  .pagination button.active {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
  }
  .pagination button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
    background-color: #f1f1f1;
  }
</style>
</head>
<body>

  <h2>データ一覧（1ページ10個）</h2>
  
  <!-- データが表示されるエリア -->
  <div id="item-list"></div>
  
  <!-- ページ送りのボタンが表示されるエリア -->
  <div id="pagination" class="pagination"></div>

<script>
  // 1. テスト用のダミーデータを生成（例として35個のデータ）
  const dataList = Array.from({ length: 35 }, (_, i) => `データ項目 ${i + 1}`);

  // 2. ページングの設定
  const itemsPerPage = 10; // 10個ずつ表示
  let currentPage = 1;     // 現在のページ（初期値は1）

  // 3. 表示領域のDOM要素を取得
  const itemListEl = document.getElementById('item-list');
  const paginationEl = document.getElementById('pagination');

  // 4. 現在のページのデータを描画する関数
  function renderList(page) {
    itemListEl.innerHTML = ''; // 一度リストを空にする
    
    // 現在のページに表示するデータの開始位置と終了位置を計算
    const start = (page - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    
    // 該当する範囲のデータを抽出
    const paginatedItems = dataList.slice(start, end);

    // 抽出したデータをHTMLとして追加
    paginatedItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';
      div.textContent = item;
      itemListEl.appendChild(div);
    });
  }

  // 5. ページ送り用のボタンを描画する関数
  function renderPagination() {
    paginationEl.innerHTML = '';
    
    // 全ページ数を計算（データ総数 ÷ 10個 の切り上げ）
    const totalPages = Math.ceil(dataList.length / itemsPerPage);

    // データがない場合はページネーションを作らない
    if (totalPages === 0) return;

    // --- 「前へ」ボタン ---
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '前へ';
    prevBtn.disabled = currentPage === 1; // 1ページ目の時は無効化
    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        updateView();
      }
    });
    paginationEl.appendChild(prevBtn);

    // --- ページ番号ボタン ---
    for (let i = 1; i <= totalPages; i++) {
      const pageBtn = document.createElement('button');
      pageBtn.textContent = i;
      
      // 現在のページのボタンをハイライト
      if (i === currentPage) {
        pageBtn.classList.add('active');
      }
      
      pageBtn.addEventListener('click', () => {
        currentPage = i;
        updateView();
      });
      paginationEl.appendChild(pageBtn);
    }

    // --- 「次へ」ボタン ---
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '次へ';
    nextBtn.disabled = currentPage === totalPages; // 最終ページの時は無効化
    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        updateView();
      }
    });
    paginationEl.appendChild(nextBtn);
  }

  // 6. リストとページネーションの両方を更新する関数
  function updateView() {
    renderList(currentPage);
    renderPagination();
  }

  // 初回読み込み時の描画を実行
  updateView();
</script>
</body>
</html>
